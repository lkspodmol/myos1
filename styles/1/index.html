<script>


const button = document.getElementById("onbutton");
const onLed = document.getElementById("on");
const iframe = document.getElementById("hamos");
const sound = new Audio("./images/power-sound.mp3");
const sound2 = new Audio("./images/boot-sound.mp3");
const sound3 = new Audio("./images/power-button-sound.mp3");

let powerOn = false;

button.addEventListener("click", () => {
    powerOn = !powerOn;

    if (powerOn) {
        iframe.src = iframe.src;
        sound.play();
        setTimeout(() => {
            onLed.style.visibility = "visible";
        }, 200);
        setTimeout(() => {
            onLed.style.visibility = "hidden"; 
        }, 1000);
        setTimeout(() => {
            onLed.style.visibility = "visible";
        }, 1500);
        setTimeout(() => {
            onLed.style.visibility = "hidden";
        }, 2000);
        setTimeout(() => {
            onLed.style.visibility = "visible";
        }, 2500);
        setTimeout(() => {
            iframe.style.visibility = "visible";
        }, 3000);
        setTimeout(() => {
            onLed.style.visibility = "hidden"; 
        }, 3500);
        setTimeout(() => {
            onLed.style.visibility = "visible";
        }, 4000);
        setTimeout(() => {
            onLed.style.visibility = "hidden";
        }, 4500);
        setTimeout(() => {
            onLed.style.visibility = "visible"; // tady na 5s se zobrazi loading...
        }, 5000);
        setTimeout(() => {
            onLed.style.visibility = "hidden";
        }, 5500);
        setTimeout(() => {
            onLed.style.visibility = "visible";
        }, 6000);
        setTimeout(() => {
            onLed.style.visibility = "hidden";
        }, 6500);
        setTimeout(() => {
            onLed.style.visibility = "visible";
        }, 7000);
        setTimeout(() => {
            onLed.style.visibility = "hidden";
        }, 7500);
        setTimeout(() => {
            onLed.style.visibility = "visible";
        }, 8000);
        setTimeout(() => {
            onLed.style.visibility = "hidden";
        }, 8500);
        setTimeout(() => {
            onLed.style.visibility = "visible"; // tady uz nebude slyset boot up
        }, 9000);
        setTimeout(() => {
            onLed.style.visibility = "hidden"; // nekde tady welcome sound jako win xp
            sound2.play();
        }, 9500);
        setTimeout(() => {
            onLed.style.visibility = "visible";
        }, 10000);
    } else {
        sound3.play();
        onLed.style.visibility = "hidden";
        iframe.style.visibility = "hidden";
    }
}); // takze to =! je jako NOT gate, potom kdyz tak, ...

let fullscreen = false;

window.addEventListener("resize", function () {
    const isFullscreen =
        window.innerHeight === screen.height &&
        window.innerWidth === screen.width;

    if (isFullscreen && !fullscreen) {
        document.querySelector("#loadingScreen").style.animation =
            "fadeOut 0.5s ease-in forwards";
    }
    else
    document.querySelector("#loadingScreen").style.animation =
        "fadeIn 0.1s ease-in forwards";

    fullscreen = isFullscreen;
});
</script>
